[[headers]]
  for = "/"
  [headers.values]
    Link = "</sitemap.xml>; rel=\"describedby\"; type=\"application/xml\", </.well-known/api-catalog>; rel=\"api-catalog\""

[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = "application/linkset+json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/openapi.json"
  [headers.values]
    Content-Type = "application/openapi+json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/status.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/http-message-signatures-directory"
  [headers.values]
    Content-Type = "application/http-message-signatures-directory+json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[edge_functions]]
  path = "/*"
  function = "markdown-negotiation"
